name: Entretien des jetons

# Le jeton Threads vit 60 jours et meurt s'il n'est pas prolongé. Ce passage le prolonge
# tous les 15 jours et réécrit le secret SOCIAL, pour qu'il n'y ait jamais rien à faire à la main.
# Nécessite un secret GH_PAT : jeton GitHub restreint à ce dépôt, permission « Secrets : lecture et écriture ».
on:
  schedule:
    - cron: '20 5 1,16 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pa-social-maintenance
  cancel-in-progress: false

jobs:
  jetons:
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Préparer .env
        env:
          SOCIAL: ${{ secrets.SOCIAL }}
        run: printf '%s\n' "$SOCIAL" > .env

      - name: Prolonger le jeton Threads
        id: threads
        run: |
          if node --env-file=.env scripts/refresh-threads.mjs --ecrire; then
            echo "renouvele=oui" >> "$GITHUB_OUTPUT"
          else
            echo "renouvele=non" >> "$GITHUB_OUTPUT"
            echo "::warning::Jeton Threads non renouvelé"
          fi

      # Une étape ne peut pas tester une variable qu'elle définit elle-même : le drapeau est posé ici
      - name: Vérifier la clé d'écriture
        id: cle
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            echo "presente=oui" >> "$GITHUB_OUTPUT"
          else
            echo "presente=non" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret GH_PAT absent : le jeton sera prolongé mais le secret SOCIAL ne sera pas réécrit."
          fi

      # Le secret n'est réécrit que si le jeton a changé, et sa valeur n'est jamais affichée
      - name: Mettre à jour le secret SOCIAL
        if: steps.threads.outputs.renouvele == 'oui' && steps.cle.outputs.presente == 'oui'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set SOCIAL < .env
          echo "Secret SOCIAL mis à jour."

      - name: Effacer les traces
        if: always()
        run: rm -f .env
