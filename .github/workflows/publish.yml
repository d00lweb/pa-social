name: Publication Instagram

on:
  # Mesuré le 18/09/2026 : GitHub n'exécute qu'une faible part des passages programmés — 2 dans la
  # journée pour un cron qui en demandait 48, et à des minutes arbitraires. Ce cron n'est donc pas
  # une horloge, c'est un filet : on demande le plus court intervalle utile pour multiplier les
  # chances quand le déclencheur o2switch s'interrompt. Le verrou de concurrence empêche les doublons,
  # et un passage sans publication due ne coûte rien.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test à blanc (images + FTP, sans publier)'
        type: boolean
        default: false
      relance:
        description: "Relancer un ancien article : mots du titre (ex. : abeilles)"
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: pa-social-publish
  cancel-in-progress: false

jobs:
  publish:
    # Verrou : aucune publication (cron, déclencheur externe ou manuel) si PUBLISH_ENABLED ne vaut pas true ; le test à blanc reste possible
    if: vars.PUBLISH_ENABLED == 'true' || inputs.dry_run
    runs-on: ubuntu-latest
    # marge : un passage peut publier plusieurs réseaux, chacun à sa minute tirée au hasard (jusqu'à
    # 14 min après le début, plus 1 à 3 min entre deux réseaux) et avec ses conteneurs à attendre
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - run: npx playwright install --with-deps chromium

      # Le secret SOCIAL contient le .env complet
      - name: Préparer .env
        env:
          SOCIAL: ${{ secrets.SOCIAL }}
        run: printf '%s\n' "$SOCIAL" > .env

      # Une exécution mise en file d'attente repart du dépôt tel qu'il était à son déclenchement :
      # sans ce rafraîchissement, elle ne voit pas les publications faites entre-temps et les refait.
      - name: Reprendre l'état publié le plus récent
        run: |
          git fetch -q origin main
          git checkout -q origin/main -- state/
          echo "État repris : $(git log -1 --format='%h %ad' --date=format:'%d/%m %H:%M' origin/main -- state/)"

      - name: Publier
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          RELANCE: ${{ inputs.relance }}
        run: node --env-file=.env src/index.mjs

      # always() : l'état est poussé même si une étape après publication échoue.
      # En cas de course entre deux exécutions, les historiques sont fusionnés au lieu d'être écrasés.
      - name: Enregistrer l'état
        if: always()
        run: |
          rm -f .env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for essai in 1 2 3; do
            rm -rf /tmp/etat-local && cp -a state /tmp/etat-local
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/fusion-etat.mjs /tmp/etat-local
            if [ -z "$(git status --porcelain -- state/)" ]; then
              echo "État inchangé."
              exit 0
            fi
            git add state/
            git commit -q -m "État : publication [skip ci]"
            if git push -q origin HEAD:main; then
              echo "État enregistré (tentative $essai)."
              exit 0
            fi
            echo "Le distant a bougé, nouvelle fusion…"
          done
          echo "::error::État non enregistré après 3 tentatives"
          exit 1
