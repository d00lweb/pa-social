name: Publication Instagram

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test à blanc (images + FTP, sans publier)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pa-social-publish
  cancel-in-progress: false

jobs:
  publish:
    # Verrou : aucune publication (cron, déclencheur externe ou manuel) si PUBLISH_ENABLED ne vaut pas true ; le test à blanc reste possible
    if: vars.PUBLISH_ENABLED == 'true' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - run: npx playwright install --with-deps chromium

      # Le secret SOCIAL contient le .env complet
      - name: Préparer .env
        env:
          SOCIAL: ${{ secrets.SOCIAL }}
        run: printf '%s\n' "$SOCIAL" > .env

      - name: Publier
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node --env-file=.env src/index.mjs

      # always() : l'état est poussé même si une étape après publication échoue
      - name: Enregistrer l'état
        if: always()
        run: |
          rm -f .env
          if [ -z "$(git status --porcelain -- state/)" ]; then
            echo "État inchangé."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "État : publication Instagram [skip ci]"
          git pull --rebase
          git push
