<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Montserrat';
    src: url('{{FONT}}') format('truetype');
    font-weight: 100 900;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }

  #root {
    --rouge: #CD402C;
    --shade: {{SHADE}};
    position: relative;
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    overflow: hidden;
    color: #fff;
  }

  /* Visibilité par canevas */
  .slide2 .only-photo,
  #root:not(.slide2) .only-slide2 { display: none; }

  /* Slide 1 et story */
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0) 30%,
      rgba(0,0,0,0) 44%,
      rgba(0,0,0,var(--shade)) 100%);
  }
  /* Bandeau logos, construit en HTML (net à toute taille), identique sur slide 1 et slide 2 */
  .bandeau {
    position: absolute;
    z-index: 2;
    top: 57px;
    left: 264px;
    width: 551px;
    height: 102px;
    padding: 0 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    transform-origin: 0 0;
  }
  .logo-of { display: block; height: 70px; }
  .logo-pa { display: block; height: 72px; }
  .avec { font-size: 19px; font-weight: 500; color: #333; }
  .edito { position: absolute; left: 100px; right: 88px; bottom: 120px; }

  .rubrique {
    display: table;
    background: var(--rouge);
    font-weight: 800;
    font-size: 56px;
    line-height: 1;
    letter-spacing: -.5px;
    padding: 22px 34px 26px;
    margin-bottom: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    text-shadow: 0 2px 6px rgba(0,0,0,.25);
  }

  .title {
    font-size: 66px;
    font-weight: 800;
    line-height: 1.16;
    letter-spacing: -1px;
    text-shadow: 0 2px 15px rgba(0,0,0,.4);
  }

  /* Surlignage pinceau sec : texture générée (brush.mjs), déborde autour du groupe de mots */
  .hl { position: relative; white-space: nowrap; isolation: isolate; }
  .hl::before {
    content: '';
    position: absolute;
    z-index: -1;
    left: -22px;
    right: -40px;
    top: -.22em;
    bottom: -.34em;
    background: var(--rouge);
    transform: rotate(-.8deg);
    -webkit-mask: url('{{BRUSH}}') 0 0 / 100% 100% no-repeat;
            mask: url('{{BRUSH}}') 0 0 / 100% 100% no-repeat;
  }

  /* Story : bandeau sous la barre Instagram, bloc calé au-dessus de la zone sticker lien + barre de réponse (500px bas) */
  .story .bandeau { top: 140px; left: 182px; transform: scale(1.3); } /* 716x133 */
  .story .edito { bottom: 380px; }

  /* X : paysage 16:9, bandeau centré, titre sur toute la largeur, dégradé bas */
  .x .bandeau { top: 44px; left: 50%; transform: translateX(-50%); }
  .x .edito { left: 72px; right: 140px; bottom: 64px; }
  .x .shade {
    background: linear-gradient(to bottom, rgba(0,0,0,0) 22%, rgba(0,0,0,.3) 48%, rgba(0,0,0,var(--shade)) 100%);
  }
  /* Variante sans logo Ouest-France */
  .no-of .logo-of, .no-of .avec { display: none; }
  .no-of .bandeau { width: auto; padding: 0 30px; }

  /* Slide 2 */
  .slide2 { background: var(--rouge); }
  /* marges haut/bas égales : centrage vertical sur le canevas, sous le bandeau */
  .desc-box {
    position: absolute;
    left: 72px;
    right: 72px;
    top: 250px;
    bottom: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .desc {
    min-width: 0;
    max-width: 100%;
    font-size: 60px;
    font-weight: 800;
    line-height: 1.24;
    text-align: center;
  }
</style>
</head>
<body>
<div id="root" class="{{FORMAT}} {{VARIANT}}">
  <img class="photo only-photo" src="{{PHOTO}}" alt="">
  <div class="shade only-photo"></div>
  <div class="bandeau">
    <img class="logo-of" src="{{LOGO_OF}}" alt="">
    <span class="avec">avec</span>
    <img class="logo-pa" src="{{LOGO_PA}}" alt="">
  </div>
  <div class="edito only-photo">
    <div class="rubrique">{{RUBRIQUE}}</div>
    <div class="title">{{TITLE_BEFORE}}<span class="hl">{{TITLE_HL}}</span>{{TITLE_AFTER}}</div>
  </div>

  <div class="desc-box only-slide2"><p class="desc">{{DESCRIPTION}}</p></div>
</div>
</body>
</html>
